name: Pull request validation

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python source
        run: python -m py_compile backend-py/app/main.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: route-go/go.mod

      - name: Test Go service
        working-directory: route-go
        run: go test ./...

      - name: Validate Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Build and start services
        run: docker compose -f infra/docker-compose.yml up --build -d

      - name: Run smoke and health tests
        run: |
          curl --fail --retry 10 --retry-delay 2 http://localhost:3000/
          test "$(curl --fail --silent http://localhost:8000/health)" = '{"status":"ok"}'
          test "$(curl --fail --silent http://localhost:8080/health)" = '{"status":"ok"}'

      - name: Scan source with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Stop services
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v