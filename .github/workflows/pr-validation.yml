name: Pull request validation

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate ephemeral Go service credentials
        run: |
          printf 'TICKET_USERNAME=ci-ticket-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'TICKET_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'ADMIN_USERNAME=ci-admin-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install -r backend-py/requirements-dev.txt

      - name: Test Python API
        run: cd backend-py && python -m pytest -q

      - name: Validate Python source
        run: python -m py_compile backend-py/app/main.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: route-go/go.mod

      - name: Test Go service
        working-directory: route-go
        run: go test ./...

      - name: Validate Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Build and start services
        run: docker compose -f infra/docker-compose.yml up --build -d

      - name: Run smoke and health tests
        run: |
          curl --fail --retry 10 --retry-delay 2 http://localhost:3000/
          test "$(curl --fail --silent --retry 10 --retry-delay 2 http://localhost:8000/health)" = '{"status":"ok"}'
          test "$(curl --fail --silent http://localhost:8080/health)" = '{"status":"ok"}'
          ticket_id=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Smoke","email":"ci@example.com","subject":"VPN connection drops","category":"Network","priority":"Low","description":"The office network VPN disconnects during calls."}' \
            http://localhost:3000/api/tickets | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          test -n "$ticket_id"
          curl --fail --silent --show-error "http://localhost:3000/api/tickets/$ticket_id" | python -c 'import json,sys; ticket=json.load(sys.stdin); assert ticket["subject"] == "VPN connection drops", ticket; assert ticket["category"] == "Network", ticket; assert "predictedCategory" not in ticket, ticket'
          corrected=$(curl --fail --silent --show-error -X PATCH \
            -H 'Content-Type: application/json' \
            -d '{"category":"Hardware"}' \
            "http://localhost:3000/api/tickets/$ticket_id")
          printf '%s' "$corrected" | python -c 'import json,sys; ticket=json.load(sys.stdin); assert ticket["category"] == "Hardware", ticket'
          hardware_count=$(curl --fail --silent --show-error http://localhost:3000/api/analytics | python -c 'import json,sys; print(json.load(sys.stdin)["categoryCounts"]["Hardware"])')
          test "$hardware_count" -ge 1
          updated_status=$(curl --fail --silent --show-error -X PATCH \
            -H 'Content-Type: application/json' \
            -d '{"status":"In progress","assignee":"Alex Chen"}' \
            "http://localhost:3000/api/tickets/$ticket_id" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          test "$updated_status" = 'In progress'
          curl --fail --silent --show-error "http://localhost:3000/api/tickets/$ticket_id" | python -c 'import json,sys; ticket=json.load(sys.stdin); assert ticket["status"] == "In progress", ticket; assert ticket["assignee"] == "Alex Chen", ticket; assert ticket["category"] == "Hardware", ticket'

      - name: Scan source with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Stop services
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v