name: Publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ticket-management

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

      - name: Build and publish Python API
        uses: docker/build-push-action@v6
        with:
          context: backend-py
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend-py:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend-py:latest

      - name: Build and publish Go route service
        uses: docker/build-push-action@v6
        with:
          context: route-go
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-route-go:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-route-go:latest

      - name: Scan published images with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan published API images with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend-py:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan published Go image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-route-go:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"
          version: v0.74.0

  staging:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify staging kubeconfig is configured
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          if [ -z "$KUBE_CONFIG_STAGING" ]; then
            echo "::error::KUBE_CONFIG_STAGING is missing from the staging environment"
            exit 1
          fi

          kubeconfig="$RUNNER_TEMP/staging-kubeconfig"
          printf '%s' "$KUBE_CONFIG_STAGING" > "$kubeconfig"
          if ! kubectl config view --kubeconfig "$kubeconfig" --raw >/dev/null; then
            echo "::error::KUBE_CONFIG_STAGING is not valid kubeconfig YAML"
            exit 1
          fi

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to staging
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -e
          sed -i "s|your-org|${IMAGE_OWNER}|g; s|:latest|:${IMAGE_TAG}|g" infra/k8s/*.yaml
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl -n ticket-management get secret route-go-auth >/dev/null || {
            echo "::error::Provision route-go-auth from the staging secret manager before deployment"
            exit 1
          }
          kubectl -n ticket-management delete deployment/ml service/ml --ignore-not-found
          kubectl apply -f infra/k8s/services.yaml -f infra/k8s/deployments.yaml
          kubectl -n ticket-management rollout status deployment/frontend --timeout=180s
          if ! kubectl -n ticket-management rollout status deployment/backend-py --timeout=180s; then
            echo "::group::backend-py deployment"
            kubectl -n ticket-management describe deployment backend-py
            echo "::endgroup::"

            echo "::group::backend-py pods"
            kubectl -n ticket-management get pods \
              -l app=backend-py \
              -o wide
            kubectl -n ticket-management describe pods \
              -l app=backend-py
            echo "::endgroup::"

            echo "::group::backend-py logs"
            kubectl -n ticket-management logs \
              -l app=backend-py \
              --all-containers \
              --tail=200 \
              --prefix
            kubectl -n ticket-management logs \
              -l app=backend-py \
              --all-containers \
              --previous \
              --tail=200 \
              --prefix || true
            echo "::endgroup::"

            echo "::group::recent Kubernetes events"
            kubectl -n ticket-management get events --sort-by=.lastTimestamp
            echo "::endgroup::"

            exit 1
          fi
          kubectl -n ticket-management rollout status deployment/route-go --timeout=180s

      - name: Run staging smoke and health tests
        run: |
          kubectl -n ticket-management run smoke-test \
            --rm \
            --attach \
            -i \
            --restart=Never \
            --image=python:3.12-slim \
            -- \
            python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          def get(url):
            with urlopen(url, timeout=10) as response:
              return json.loads(response.read())

          def send(url, payload, method="POST"):
            request = Request(
              url,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method=method,
            )
            with urlopen(request, timeout=10) as response:
              return json.loads(response.read())

          with urlopen("http://frontend/", timeout=10) as response:
            assert response.status == 200
            assert b"switchboard" in response.read().lower()
          assert get("http://backend-py:8000/health")["status"] == "ok"
          assert get("http://route-go:8080/health")["status"] == "ok"

          ticket = send("http://frontend/api/tickets", {
            "name": "Staging Smoke",
            "email": "staging-smoke@example.com",
            "subject": "VPN connection drops",
            "category": "Network",
            "priority": "Low",
            "description": "The office network VPN disconnects during calls.",
          })
          assert ticket["category"] == "Network", ticket
          ticket_url = f"http://frontend/api/tickets/{ticket['id']}"
          persisted = get(ticket_url)
          assert persisted["category"] == "Network", persisted

          corrected = send(ticket_url, {
            "category": "Hardware",
            "status": "In progress",
            "assignee": "Alex Chen",
          }, method="PATCH")
          assert corrected["category"] == "Hardware", corrected
          updated = get(ticket_url)
          assert updated["category"] == "Hardware", updated
          assert updated["status"] == "In progress", updated
          assert updated["assignee"] == "Alex Chen", updated
          analytics = get("http://frontend/api/analytics")
          assert analytics["categoryCounts"]["Hardware"] >= 1, analytics
          PY
  production:
    needs: [publish, staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify production kubeconfig is configured
        env:
          KUBE_CONFIG_PRODUCTION: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: |
          if [ -z "$KUBE_CONFIG_PRODUCTION" ]; then
            echo "::error::KUBE_CONFIG_PRODUCTION is missing from the production environment"
            exit 1
          fi

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy approved release to production
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          sed -i "s|your-org|${IMAGE_OWNER}|g; s|:latest|:${IMAGE_TAG}|g" infra/k8s/*.yaml
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl -n ticket-management get secret route-go-auth >/dev/null || {
            echo "::error::Provision route-go-auth from the production secret manager before deployment"
            exit 1
          }
          kubectl -n ticket-management delete deployment/ml service/ml --ignore-not-found
          kubectl apply -f infra/k8s/services.yaml -f infra/k8s/deployments.yaml
          kubectl -n ticket-management rollout status deployment/frontend --timeout=180s
          kubectl -n ticket-management rollout status deployment/backend-py --timeout=180s
          kubectl -n ticket-management rollout status deployment/route-go --timeout=180s