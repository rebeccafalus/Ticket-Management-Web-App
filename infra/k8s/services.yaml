apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ticket-management
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-py
  namespace: ticket-management
spec:
  selector:
    app: backend-py
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: ticket-management
spec:
  selector:
    app: ml
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: route-go
  namespace: ticket-management
spec:
  selector:
    app: route-go
  ports:
    - port: 8080
      targetPort: 8080