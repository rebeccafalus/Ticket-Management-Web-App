apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-go
  namespace: ticket-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-go
  template:
    metadata:
      labels:
        app: route-go
    spec:
      containers:
        - name: route-go
          image: ghcr.io/your-org/ticket-management-route-go:latest
          envFrom:
            - secretRef:
                name: route-go-auth
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault