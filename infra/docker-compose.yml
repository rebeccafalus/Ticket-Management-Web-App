services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-py
      - ml
      - route-go

  backend-py:
    build:
      context: ../backend-py
    ports:
      - "8000:8000"

  ml:
    build:
      context: ../ml
    ports:
      - "8001:8001"

  route-go:
    build:
      context: ../route-go
    ports:
      - "8080:8080"
    environment:
      TICKET_PASSWORD: ticket-management-dev

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - route-go

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  prometheus-data: