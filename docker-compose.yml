services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inquiries
      POSTGRES_USER: inquiry_app
      POSTGRES_PASSWORD: inquiry_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inquiry_app -d inquiries && psql -U inquiry_app -d inquiries -tAc 'SELECT COUNT(*) FROM inquiries' | grep -q '3'"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=inquiries;Username=inquiry_app;Password=inquiry_app
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data: